<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mentor — Atelier</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@200;300;400;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="theme-warm">

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <a href="../index.html" class="sidebar-brand">
                <i class="fas fa-paint-brush"></i> Atelier
            </a>
        </div>
        <div class="sidebar-section">
            <span class="sidebar-section-title">Menu</span>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html" class="sidebar-link"><i class="fas fa-chart-bar"></i> Dashboard</a></li>
                <li><a href="mentor.html" class="sidebar-link active"><i class="fas fa-robot"></i> AI Mentor</a></li>
                <li><a href="roadmap.html" class="sidebar-link"><i class="fas fa-map"></i> Learning Roadmap</a></li>
                <li><a href="exercises.html" class="sidebar-link"><i class="fas fa-pen-fancy"></i> Exercises</a></li>
                <li><a href="progress.html" class="sidebar-link"><i class="fas fa-chart-line"></i> Progress</a></li>
                <li><a href="drawing-lab.html" class="sidebar-link"><i class="fas fa-palette"></i> Drawing Lab</a></li>
                <li><a href="profile.html" class="sidebar-link"><i class="fas fa-user"></i> Profile</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-with-sidebar chat-main">
        <div class="chat-container">
            <!-- Chat Sessions Sidebar -->
            <div class="chat-sessions">
                <div class="chat-sessions-header">
                    <h3>Conversations</h3>
                    <button id="newChatBtn" class="btn btn-sm btn-primary">
                        <i class="fas fa-plus"></i> New Chat
                    </button>
                </div>
                <div class="chat-sessions-list" id="chatSessionsList">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Chat Area -->
            <div class="chat-area">
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-message assistant">
                        <div class="chat-avatar assistant"><i class="fas fa-robot"></i></div>
                        <div class="chat-bubble">
                            <p>Hello! I'm your AI Art Mentor. Ask me anything about drawing, art techniques, or get feedback on your work. How can I help you today?</p>
                        </div>
                    </div>
                </div>
                <div class="chat-input-area">
                    <textarea id="chatInput" class="chat-input" placeholder="Ask your art mentor..." rows="2"></textarea>
                    <button id="sendMessageBtn" class="btn btn-primary btn-send">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/pages/mentor.js"></script>
</body>
</html>
