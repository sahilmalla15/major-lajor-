<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — AtelierAI</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="nav-brand">
                <i class="fas fa-paint-brush"></i> AtelierAI
            </a>
            <div class="nav-links">
                <a href="../index.html" class="nav-link">Home</a>
            </div>
        </div>
    </nav>

    <!-- Register Card -->
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Begin Your Art Journey</h1>
            <p class="auth-subtitle">Create your account and start learning</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Confirm your password" required>
                </div>
                <div class="form-group">
                    <label for="skillLevel">Skill Level</label>
                    <select id="skillLevel" name="skillLevel" class="form-input">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="goals">Artistic Goals (optional)</label>
                    <textarea id="goals" name="goals" class="form-input form-textarea" placeholder="What do you want to learn?" rows="3"></textarea>
                </div>

                <div id="registerError" class="auth-error" style="display: none;"></div>

                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>

            <p class="auth-footer-text">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/pages/register.js"></script>
</body>
</html>
