<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress — AtelierAI</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="main-with-sidebar">

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <a href="../index.html" class="sidebar-brand">
                <i class="fas fa-paint-brush"></i> AtelierAI
            </a>
        </div>
        <div class="sidebar-section">
            <span class="sidebar-section-title">Menu</span>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html" class="sidebar-link"><i class="fas fa-chart-bar"></i> Dashboard</a></li>
                <li><a href="mentor.html" class="sidebar-link"><i class="fas fa-robot"></i> AI Mentor</a></li>
                <li><a href="roadmap.html" class="sidebar-link"><i class="fas fa-map"></i> Learning Roadmap</a></li>
                <li><a href="exercises.html" class="sidebar-link"><i class="fas fa-pen-fancy"></i> Exercises</a></li>
                <li><a href="progress.html" class="sidebar-link active"><i class="fas fa-chart-line"></i> Progress</a></li>
                <li><a href="drawing-lab.html" class="sidebar-link"><i class="fas fa-palette"></i> Drawing Lab</a></li>
                <li><a href="profile.html" class="sidebar-link"><i class="fas fa-user"></i> Profile</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-with-sidebar">
        <div class="page-header">
            <h1 class="page-title">Your Progress</h1>
        </div>

        <!-- Loading indicator -->
        <div id="loadingIndicator" class="loading-indicator" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i> Loading progress data...
        </div>

        <!-- Error message -->
        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <!-- Stats Row -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div class="stat-content">
                    <span class="stat-label">Lessons</span>
                    <span class="stat-value" id="totalLessons">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✏️</div>
                <div class="stat-content">
                    <span class="stat-label">Exercises</span>
                    <span class="stat-value" id="totalExercises">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎨</div>
                <div class="stat-content">
                    <span class="stat-label">Queries</span>
                    <span class="stat-value" id="totalQueries">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-content">
                    <span class="stat-label">Streak</span>
                    <span class="stat-value" id="currentStreak">0</span>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="charts-row">
            <div class="card chart-card">
                <div class="card-header">
                    <h3>Lessons Over Time</h3>
                </div>
                <div class="card-body">
                    <canvas id="lessonsChart" width="400" height="250"></canvas>
                </div>
            </div>
            <div class="card chart-card">
                <div class="card-header">
                    <h3>Skills Breakdown</h3>
                </div>
                <div class="card-body">
                    <canvas id="skillsChart" width="400" height="250"></canvas>
                </div>
            </div>
        </div>

        <!-- Achievements Section -->
        <section class="achievements-section">
            <h2 class="section-title">Achievements</h2>
            <div class="badge-grid" id="badgeGrid">
                <!-- Populated by JS -->
            </div>
        </section>

        <!-- Recent Activity -->
        <section class="recent-activity-section">
            <h2 class="section-title">Recent Activity</h2>
            <ul class="activity-list" id="progressActivityList">
                <!-- Populated by JS -->
            </ul>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/pages/progress.js"></script>
</body>
</html>
