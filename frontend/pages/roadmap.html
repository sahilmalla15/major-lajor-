<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Roadmap — Atelier</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@200;300;400;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="theme-warm">

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <a href="../index.html" class="sidebar-brand">
                <i class="fas fa-paint-brush"></i> Atelier
            </a>
        </div>
        <div class="sidebar-section">
            <span class="sidebar-section-title">Menu</span>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html" class="sidebar-link"><i class="fas fa-chart-bar"></i> Dashboard</a></li>
                <li><a href="mentor.html" class="sidebar-link"><i class="fas fa-robot"></i> AI Mentor</a></li>
                <li><a href="roadmap.html" class="sidebar-link active"><i class="fas fa-map"></i> Learning Roadmap</a></li>
                <li><a href="exercises.html" class="sidebar-link"><i class="fas fa-pen-fancy"></i> Exercises</a></li>
                <li><a href="progress.html" class="sidebar-link"><i class="fas fa-chart-line"></i> Progress</a></li>
                <li><a href="drawing-lab.html" class="sidebar-link"><i class="fas fa-palette"></i> Drawing Lab</a></li>
                <li><a href="profile.html" class="sidebar-link"><i class="fas fa-user"></i> Profile</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-with-sidebar">
        <div class="page-header">
            <h1 class="page-title">Your Learning Roadmap</h1>
            <button id="generateRoadmapBtn" class="btn btn-primary">
                <i class="fas fa-sync-alt"></i> Generate New
            </button>
        </div>

        <!-- Loading indicator -->
        <div id="loadingIndicator" class="loading-indicator" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i> Loading your roadmap...
        </div>

        <!-- Error message -->
        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <!-- Timeline -->
        <div class="roadmap-timeline" id="roadmapTimeline">
            <!-- Populated by JS -->
        </div>

        <!-- Generate Modal -->
        <div id="generateModal" class="modal" style="display: none;">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Generate New Roadmap</h2>
                    <button class="modal-close" id="modalClose">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="roadmapSkillLevel">Skill Level</label>
                        <select id="roadmapSkillLevel" class="form-input">
                            <option value="beginner">Beginner</option>
                            <option value="intermediate">Intermediate</option>
                            <option value="advanced">Advanced</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Areas of Interest</label>
                        <div class="checkbox-grid">
                            <label class="checkbox-label">
                                <input type="checkbox" value="perspective"> Perspective
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="anatomy"> Anatomy
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="shading"> Shading
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="composition"> Composition
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="color"> Color Theory
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="figure"> Figure Drawing
                            </label>
                        </div>
                    </div>
                    <div id="generateError" class="auth-error" style="display: none;"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="modalCancel">Cancel</button>
                    <button class="btn btn-primary" id="modalGenerate">Generate</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/pages/roadmap.js"></script>
</body>
</html>
